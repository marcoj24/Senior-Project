[project]
name = "trading-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml==6.0.3",
    "coinbase-advanced-py==1.8.4",
    "anthropic==2.8.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
